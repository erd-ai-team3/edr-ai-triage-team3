
apiVersion: batch/v1
kind: Job

metadata:
  name: soc-setup
  namespace: soc

spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600

  template:
    metadata:
      labels:
        app: soc-setup

    spec:
      restartPolicy: Never

      imagePullSecrets:
        - name: ghcr-secret

      # OpenSearch가 준비될 때까지 대기
      initContainers:
        - name: wait-opensearch
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null http://opensearch:9200; do
                echo "Waiting for OpenSearch..."
                sleep 3
              done

          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"

      # 기존 프로젝트 초기화 코드 실행
      containers:
        - name: setup
          image: ghcr.io/erd-ai-team3/edr-ai-triage-team3:lab-v3
          imagePullPolicy: Always

          command:
            - python
            - -m
            - soc.setup

          envFrom:
            - configMapRef:
                name: soc-config

          env:
            - name: BACKEND
              value: "real"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
