
services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: edr-opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    volumes:
      - edr-opensearch-data:/usr/share/opensearch/data

  postgres:
    image: postgres:16
    container_name: edr-postgres
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: soc
      POSTGRES_DB: soc
    ports:
      - "5432:5432"
    volumes:
      - edr-postgres-data:/var/lib/postgresql/data

volumes:
  edr-opensearch-data:
  edr-postgres-data:
